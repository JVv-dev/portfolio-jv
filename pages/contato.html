<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | João Vitor</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>João Vitor</h1>
        <nav>
            <a href="../index.html">Sobre mim</a>
            <a href="formacao.html">Formação</a>
            <a href="portfolio.html">Portfólio</a>
            <a href="contato.html">Contato</a>
            <button id="btn-dark-mode"><img src="../imagens/image.png" alt="Icone do modo escuro" aria-label="Alternar modo escuro" class="ico-buton"></button>
        </nav>
    </header>

    <main>
        <section class="conteudo-paginas">
            <h2>Entre em Contato</h2>
            
            <form id="formContato" class="formulario">
                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Seu nome">
                </div>
                
                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="Seu e-mail">
                </div>
                
                <div class="campo">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" rows="5" placeholder="Sua mensagem"></textarea>
                </div>
                
                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
                <p id="mensagemErro" class="erro-oculto">Por favor, preencha todos os campos!</p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 João Vitor.</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
